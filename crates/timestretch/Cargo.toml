[package]
name        = "opendeck-timestretch"
description = "Resampler (no key-lock) and timestretcher (key-lock) pipeline stages"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
pkg-config = "0.3"
cc         = "1"     # compiles third_party/rubberband when there's no system lib

[features]
default = ["bungee"]
# Build the vendored Bungee stretcher as a second key-lock engine
# (OPENDECK_STRETCH=bungee).  Off: Rubber Band only.
bungee  = []

[dependencies]
opendeck-types = { workspace = true }
rubato         = { workspace = true }
log            = { workspace = true }

[dev-dependencies]
rustfft = "6"        # independent DSP calibration for the RTF regression guard
