[package]
name        = "opendeck-protocol"
description = "MCU↔host packet protocol — no_std compatible for future MCU firmware sharing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { workspace = true }

[features]
# no_std by default (runs on the MCU); enable `std` for host-side builds/tests.
std = []
