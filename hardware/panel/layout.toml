# ADK-1000 panel — every physical control, in millimetres from the top-left
# corner of the face (x to the right, y DOWN, as on a drawing).  gen.py turns
# this into the tscircuit board (index.circuit.tsx); the printed faceplate CAD
# reads the same file, so copper and plastic cannot disagree.
#
# PROVENANCE.  `status = "photo"` positions are the faceplate skin's fractions
# (crates/app/src/screen.rs faceplate_layout, measured on a labelled grid over
# the deck photo, 2026-08-27) scaled to the face size below.  They are good to
# a few millimetres and must be verified with a caliper before fabrication.
# `status = "measured"` means a caliper number from the real unit.
# `status = "guess"` means the control exists on the XDJ but its position is
# not measured yet; gen.py still places it so the board is complete, and the
# silkscreen marks it "VERIFY".

[face]
width_mm  = 305.7      # XDJ-1000MK2 published width; verify
height_mm = 387.5      # from the photo aspect (860 x 1090) at that width; the published depth is 378.8
status    = "photo"
# The board is the face minus a margin for the enclosure lip.
board_margin_mm = 4.0

[display]
# The 7" 1024x600 panel; its active area and the cutout for the module.
x = 76.4
y = 29.1
width = 148.3
height = 83.3
status = "photo"
cutout_margin_mm = 1.0

[hub]
# RP2350-Zero module (castellated, USB-C on its short edge).  Sits at the rear
# edge so the USB-C faces out the back of the enclosure.
x = 230.0
y = 12.0
rotation = 90
status = "guess"

# ───────────────────────── buttons ─────────────────────────
# kind = "button": a 6x6 tact switch at (x, y) with a printed cap of cap_mm,
# and an LED next to it when `led` is set (colour as on the XDJ).
# led_offset_mm: where the LED sits relative to the switch centre (default
# 6 mm to the right).

[[control]]
name = "play"
kind = "button"
x = 21.4
y = 343.7
cap_mm = 35
led = "green"
status = "photo"

