# ───────────────────────── encoders, fader, jog ─────────────────────────

[[control]]
name = "browse"
kind = "encoder"      # EC11 with push
x = 258.3
y = 79.4
knob_mm = 40
status = "photo"

[[control]]
name = "jog_touch"    # the top-plate switch: a tact switch under the top disc
kind = "button"
x = 152.9
y = 230.0
cap_mm = 0
status = "photo"

[[control]]
name = "jog"
kind = "jog"          # MT6701 under the platter shaft + bearing mount holes
x = 152.9
y = 250.0
platter_mm = 206      # matches hardware/cad/jog_wheel.py OUTER_D — verify
bearing_bolt_circle_mm = 30
bearing_bolt_mm = 3.2
status = "photo"

[[control]]
name = "fader"
kind = "fader"        # 100 mm slide pot, slot cut in the board
x = 279.0
y = 301.3             # slot centre
travel_mm = 100
slot_mm = [3, 104]
status = "photo"

# Pi 5 mounting holes (58 x 49 mm pattern), behind the display, so the
# computer bolts to the panel board.
[pi]
# Under the jog, bottom-left quadrant: the Pi bolts to the BACK of the panel
# board; the platter clears the standoff heads on the front.
x = 60.0
y = 285.0
status = "guess"
